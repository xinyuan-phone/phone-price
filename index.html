<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鑫源数码回收 · 手机参考报价</title>
<script src="https://registry.npmmirror.com/lucide/1.28.0/files/dist/umd/lucide.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f8;color:#1f2333;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
button{font-family:inherit}
:focus-visible{outline:2px solid #3949ab;outline-offset:2px}

/* ===== 顶部 ===== */
.hero{background:linear-gradient(135deg,#1a237e 0%,#283593 55%,#3949ab 100%);color:#fff;padding:30px 20px 34px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.hero::before{width:240px;height:240px;right:-70px;top:-80px}
.hero::after{width:160px;height:160px;left:-50px;bottom:-70px}
.hero-inner{max-width:720px;margin:0 auto;position:relative;z-index:1}
.shop-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:4px 12px;border-radius:999px;font-size:12px;letter-spacing:1px}
.shop-badge svg{width:14px;height:14px}
.hero h1{font-size:27px;font-weight:800;margin-top:14px;letter-spacing:1px}
.hero-sub{font-size:13px;color:rgba(255,255,255,.78);margin-top:6px}
.date-pill{display:inline-block;margin-top:12px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);padding:4px 12px;border-radius:8px;font-size:12px;color:rgba(255,255,255,.92)}

/* ===== 步骤条 ===== */
.steps{max-width:720px;margin:14px auto 0;padding:0 16px;display:flex;align-items:center}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#9aa0b5;cursor:pointer;min-width:54px;user-select:none;-webkit-user-select:none;transition:color .25s}
.step .dot{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #d7dae6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#9aa0b5;transition:all .3s}
.step.current{color:#1a237e;font-weight:700}
.step.current .dot{background:#1a237e;border-color:#1a237e;color:#fff;box-shadow:0 0 0 4px rgba(26,35,126,.12)}
.step.done{color:#3949ab}
.step.done .dot{background:#3949ab;border-color:#3949ab;color:#fff}
.step-line{flex:1;height:2px;background:#d7dae6;margin:0 6px;min-width:14px;border-radius:2px;transition:background .3s}
.step-line.done{background:#3949ab}

/* ===== 容器 ===== */
.container{max-width:720px;margin:0 auto;padding:14px 16px 36px}
.card{background:#fff;border-radius:16px;padding:20px 18px;box-shadow:0 1px 3px rgba(20,30,80,.06)}
.sec-title{font-size:16px;font-weight:700;color:#1a237e;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.step-tag{font-size:11px;font-weight:700;color:#fff;background:#1a237e;padding:3px 8px;border-radius:6px;letter-spacing:1px}

/* ===== 品牌 ===== */
.brand-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.brand-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;background:#f7f8fc;border:2px solid transparent;border-radius:14px;cursor:pointer;transition:all .25s;font-family:inherit}
.brand-card:hover{border-color:#c5cbe8;transform:translateY(-2px)}
.brand-card:active{transform:scale(.98)}
.brand-card.active{border-color:#1a237e;background:#eef0fb}
.brand-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.brand-name{font-size:14px;font-weight:700;color:#1f2333}
.brand-cnt{font-size:11px;color:#9aa0b5}

/* ===== 型号 ===== */
.model-list{display:flex;flex-direction:column;gap:8px;max-height:54vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
.model-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 14px;background:#f7f8fc;border:2px solid transparent;border-radius:12px;cursor:pointer;transition:all .2s;font-family:inherit}
.model-item:hover{border-color:#c5cbe8}
.model-item:active{transform:scale(.99)}
.model-item.active{border-color:#1a237e;background:#eef0fb}
.model-name{font-size:14px;font-weight:600;color:#1f2333}
.model-price{font-size:12px;color:#c2410c;font-weight:700;background:#fff4e5;padding:3px 9px;border-radius:999px;white-space:nowrap}

/* ===== 存储 ===== */
.chip-grid{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 24px;border-radius:999px;background:#f7f8fc;border:2px solid transparent;font-size:15px;font-weight:600;color:#1f2333;cursor:pointer;transition:all .2s;font-family:inherit}
.chip:hover{border-color:#c5cbe8}
.chip.active{border-color:#1a237e;background:#1a237e;color:#fff}

/* ===== 成色 ===== */
.grade-list{display:flex;flex-direction:column;gap:8px}
.grade-item{display:flex;align-items:center;gap:10px;padding:12px;background:#f7f8fc;border:2px solid transparent;border-radius:12px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.grade-item:hover{border-color:#c5cbe8}
.grade-item.active{border-color:#1a237e;background:#eef0fb}
.grade-badge{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid #d7dae6;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#1a237e;flex-shrink:0;transition:all .2s}
.grade-item.active .grade-badge{background:#1a237e;color:#fff;border-color:#1a237e}
.grade-info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.grade-name{font-size:14px;font-weight:700;color:#1f2333}
.grade-desc{font-size:11px;color:#8a90a8}
.grade-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.grade-rate{font-size:11px;color:#1a237e;background:#e3e6f7;padding:2px 8px;border-radius:999px;font-weight:700}
.grade-price{font-size:15px;font-weight:800;color:#c2410c}

/* ===== 结果 ===== */
.result-card{background:linear-gradient(135deg,#1a237e,#3949ab);border-radius:18px;padding:28px 20px;text-align:center;color:#fff;box-shadow:0 10px 26px rgba(26,35,126,.28)}
.result-head{font-size:13px;letter-spacing:4px;color:rgba(255,255,255,.75)}
.result-price{font-size:54px;font-weight:800;color:#ffc107;margin:12px 0 4px;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.1}
.result-desc{font-size:13px;color:rgba(255,255,255,.94);background:rgba(255,255,255,.13);display:inline-block;padding:6px 14px;border-radius:999px;margin-top:10px}
.result-note{font-size:12px;color:rgba(255,255,255,.62);margin-top:14px}
.result-actions{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
#btnRestart{background:#ffc107;color:#1a237e;border:none;border-radius:999px;padding:12px 30px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s}
#btnRestart:active{transform:scale(.97)}
.result-link{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.result-link:active{transform:scale(.97)}

/* ===== 底部 ===== */
.footer{max-width:720px;margin:0 auto;padding:4px 20px 40px;text-align:center}
.contact{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,30,80,.05)}
.contact-item{display:flex;align-items:center;gap:7px;font-size:13px;color:#5a5f75}
.contact-item svg{width:16px;height:16px;color:#1a237e;flex-shrink:0}
.contact-item b{color:#1f2333}
.foot-note{font-size:11px;color:#9aa0b5;margin-top:14px}
.foot-copy{font-size:11px;color:#b6bacd;margin-top:6px}

/* ===== 齿轮（长按3秒进后台） ===== */
#gearWrap{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;width:54px;height:54px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#gearBtn{width:46px;height:46px;border-radius:50%;background:rgba(26,35,126,.88);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(26,35,126,.32);transition:transform .2s,background .2s;backdrop-filter:blur(4px);touch-action:none}
#gearBtn svg{width:22px;height:22px}
#gearWrap.holding #gearBtn{transform:scale(1.12);background:#1a237e}
#gearRing{position:absolute;inset:-4px;width:62px;height:62px;transform:rotate(-90deg);pointer-events:none}
#gearRing circle{fill:none;stroke:#ffc107;stroke-width:3.5;stroke-linecap:round}
#gearTip{position:absolute;right:62px;top:50%;transform:translateY(-50%);background:rgba(25,30,50,.92);color:#fff;font-size:11px;padding:6px 11px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
#gearWrap.holding #gearTip{opacity:1}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(15,20,45,.55);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:320px;text-align:center;animation:popIn .3s ease}
.modal h3{font-size:18px;color:#1f2333}
.modal-sub{font-size:13px;color:#8a90a8;margin:6px 0 16px}
#pwInput{width:100%;text-align:center;font-size:26px;letter-spacing:10px;padding:12px 0;border:2px solid #d7dae6;border-radius:12px;outline:none;font-weight:700;color:#1f2333}
#pwInput:focus{border-color:#1a237e}
.pw-err{color:#c62f1f;font-size:12px;margin-top:8px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
#pwOk{background:#1a237e;color:#fff;border:none}
#pwCancel{background:#f1f2f7;color:#5a5f75;border:none}

/* ===== 后台 ===== */
.admin{position:fixed;inset:0;background:#f0f2f8;z-index:90;display:flex;flex-direction:column}
.admin-head{background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.admin-head h2{font-size:17px;font-weight:800}
#adminClose{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
#adminClose svg{width:18px;height:18px}
.admin-tabs{display:flex;background:#fff;border-bottom:1px solid #e6e8f2;position:sticky;top:0;z-index:2}
.atab{flex:1;padding:13px 0;font-size:14px;font-weight:600;color:#8a90a8;background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.atab.active{color:#1a237e;border-bottom-color:#1a237e}
.admin-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;max-width:760px;width:100%;margin:0 auto}

.abrands{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:14px}
.abrand{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;border:2px solid #e3e5f0;font-size:13px;font-weight:700;color:#5a5f75;cursor:pointer;transition:all .2s;font-family:inherit}
.abrand.active{background:#1a237e;border-color:#1a237e;color:#fff}
.ab-logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#3949ab,#1a237e);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.abrand.active .ab-logo{background:rgba(255,255,255,.22)}
.ab-cnt{font-size:10px;background:rgba(26,35,126,.08);color:#3949ab;border-radius:999px;padding:1px 6px;font-weight:700}
.abrand.active .ab-cnt{background:rgba(255,255,255,.22);color:#fff}

.amodel{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.amodel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.amodel-name{font-size:14px;font-weight:700;color:#1f2333}
.adel{background:#fdecec;color:#c62f1f;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.amodel-prices{display:flex;flex-wrap:wrap;gap:8px}
.pcell{display:flex;flex-direction:column;align-items:center;gap:4px;background:#f4f5fa;border-radius:10px;padding:7px 9px}
.pcell span{font-size:11px;color:#5a5f75;font-weight:700}
.price-inp{width:66px;border:1.5px solid #d7dae6;border-radius:7px;padding:6px;font-size:16px;font-weight:700;text-align:center;outline:none;font-family:inherit;background:#fff;color:#1f2333}
.price-inp:focus{border-color:#1a237e}

.admin-card{background:#fff;border-radius:14px;padding:18px 16px;margin-top:14px}
.admin-card h4{font-size:14px;color:#1f2333;margin-bottom:12px}
.admin-card input[type=text],.admin-card input:not([type]){width:100%;border:1.5px solid #d7dae6;border-radius:10px;padding:12px;font-size:16px;margin-bottom:10px;outline:none;font-family:inherit;background:#fff;color:#1f2333}
.admin-card input:focus{border-color:#1a237e}
.admin-card label{display:block;font-size:12px;font-weight:700;color:#5a5f75;margin:10px 0 5px}
.admin-card label:first-of-type{margin-top:0}

.b-pri{background:#1a237e;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.b-pri:active{transform:scale(.98)}
.b-sec{background:#fff;color:#1a237e;border:1.5px solid #1a237e;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.b-sec:active{transform:scale(.98)}
.b-danger{background:#fdecec;color:#c62f1f;border:1.5px solid #e8b4b4;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.b-danger:active{transform:scale(.98)}
.w100{width:100%}
.data-actions{display:flex;flex-direction:column;gap:12px}
.data-actions .b-pri,.data-actions .b-sec,.data-actions .b-danger{display:flex;align-items:center;justify-content:center;gap:8px}
.data-actions svg{width:16px;height:16px}
.data-note{font-size:12px;color:#9aa0b5;text-align:center;margin-top:14px}
.add-tip{font-size:11px;color:#8a90a8;margin-bottom:10px}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:rgba(25,30,50,.93);color:#fff;font-size:13px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:120;white-space:nowrap;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 动画 ===== */
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.anim{animation:slideUp .35s cubic-bezier(.22,.61,.36,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes pricePop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.price-pop{animation:pricePop .5s cubic-bezier(.22,.61,.36,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <span class="shop-badge"><i data-lucide="smartphone"></i>手机回收</span>
    <h1 id="shopName">鑫源数码回收</h1>
    <p class="hero-sub">今日回收参考报价 · 每日更新</p>
    <span class="date-pill" id="today"></span>
  </div>
</header>

<nav class="steps">
  <div class="step" data-step="1"><span class="dot">1</span><span>品牌</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="2"><span class="dot">2</span><span>型号</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="3"><span class="dot">3</span><span>存储</span></div>
  <div class="step-line"></div>
  <div class="step" data-step="4"><span class="dot">4</span><span>成色</span></div>
</nav>

<main class="container">
  <section id="sec-brand" class="card step-card">
    <h2 class="sec-title"><span class="step-tag">第1步</span>选择手机品牌</h2>
    <div id="brandGrid" class="brand-grid"></div>
  </section>

  <section id="sec-model" class="card step-card hidden">
    <h2 class="sec-title"><span class="step-tag">第2步</span>选择型号</h2>
    <div id="modelList" class="model-list"></div>
  </section>

  <section id="sec-storage" class="card step-card hidden">
    <h2 class="sec-title"><span class="step-tag">第3步</span>选择存储容量</h2>
    <div id="storageChips" class="chip-grid"></div>
  </section>

  <section id="sec-grade" class="card step-card hidden">
    <h2 class="sec-title"><span class="step-tag">第4步</span>选择成色等级</h2>
    <div id="gradeList" class="grade-list"></div>
  </section>

  <section id="sec-result" class="result-card step-card hidden">
    <div class="result-head">参 考 报 价</div>
    <div id="resultPrice" class="result-price price-pop">¥0</div>
    <div id="resultDesc" class="result-desc"></div>
    <div class="result-note">价格每日更新，以门店当面检测为准</div>
    <div class="result-actions">
      <button id="btnBackGrade" class="result-link">调整成色</button>
      <button id="btnRestart" class="">重新查询</button>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="contact">
    <div class="contact-item"><i data-lucide="message-circle"></i><span>微信号：<b id="footWechat">待更新</b></span></div>
    <div class="contact-item"><i data-lucide="phone"></i><span>电话：<b id="footPhone">待更新</b></span></div>
  </div>
  <p class="foot-note">* 以上价格仅供参考，实际回收价以门店当面检测为准</p>
  <p class="foot-copy">手机回收报价查询 · 每日更新</p>
</footer>

<div id="gearWrap">
  <svg id="gearRing" viewBox="0 0 62 62"><circle cx="31" cy="31" r="25.5"/></svg>
  <button id="gearBtn" aria-label="更多"><i data-lucide="settings"></i></button>
  <div id="gearTip">长按进入管理</div>
</div>

<div id="pwMask" class="mask hidden">
  <div class="modal">
    <h3>后台管理</h3>
    <p class="modal-sub">请输入管理密码</p>
    <input id="pwInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <p id="pwErr" class="pw-err hidden">密码错误，请重试</p>
    <div class="modal-actions">
      <button id="pwCancel">取消</button>
      <button id="pwOk">确认</button>
    </div>
  </div>
</div>

<div id="adminMask" class="admin hidden">
  <div class="admin-head">
    <h2>后台管理</h2>
    <button id="adminClose" aria-label="关闭"><i data-lucide="x"></i></button>
  </div>
  <div class="admin-tabs">
    <button class="atab active" data-tab="models">机型管理</button>
    <button class="atab" data-tab="shop">店铺设置</button>
    <button class="atab" data-tab="data">数据管理</button>
  </div>
  <div class="admin-body">
    <div id="tab-models">
      <div id="abrands" class="abrands"></div>
      <div id="amodels"></div>
      <div class="admin-card">
        <h4>添加新机型</h4>
        <p class="add-tip" id="addTip"></p>
        <input id="addName" type="text" placeholder="型号名称，如 iPhone 17">
        <input id="addStorage" type="text" placeholder="存储容量，逗号分隔，如 128G,256G">
        <input id="addPrice" type="text" placeholder="靓机参考价，与存储对应，如 3500,3900">
        <button id="addBtn" class="b-pri w100">添加机型</button>
      </div>
    </div>
    <div id="tab-shop" class="hidden">
      <div class="admin-card">
        <h4>店铺信息</h4>
        <label>店铺名称</label>
        <input id="setName" type="text">
        <label>微信号</label>
        <input id="setWechat" type="text">
        <label>联系电话</label>
        <input id="setPhone" type="text">
        <button id="saveShop" class="b-pri w100">保存设置</button>
      </div>
    </div>
    <div id="tab-data" class="hidden">
      <div class="admin-card">

function normalize(d){
  if(!d||!d.brands) return d;
  d.brands.forEach(b=>b.models.forEach(m=>{
    if(m.s!==undefined){ m.name=m.m; m.storages=m.s.split('/'); m.prices=m.p.split('/').map(Number); delete m.m; delete m.s; delete m.p; }
  }));
  return d;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const BASE = normalize(clone(DEFAULT_DATA));

let DATA = (function(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){ const d=JSON.parse(raw); if(d&&d.brands&&d.brands.length) return normalize(d); }
  }catch(e){}
  return clone(BASE);
})();
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }

let step = 1;

let toastTimer = null;

const $ = id => document.getElementById(id);

/* ---------- 通用 ---------- */
function toast(msg){
  const t=$('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
function restartAnim(el){
  el.classList.remove('anim');
  void el.offsetWidth;
  el.classList.add('anim');
}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'年'+String(d.getMonth()+1).padStart(2,'0')+'月'+String(d.getDate()).padStart(2,'0')+'日';
}
function curBrand(){ return DATA.brands.find(b=>b.id===sel.brand); }
function curModel(){ const b=curBrand(); return b?b.models.find(m=>m.name===sel.model):null; }
function calcPrice(model, si, rate){ return Math.round(model.prices[si]*rate); }
function fmt(n){ return '¥'+n.toLocaleString('zh-CN'); }

/* ---------- 步骤条 ---------- */
function goStep(n){
  step=n;
  document.querySelectorAll('.step').forEach((s,i)=>{
    const idx=i+1;
    s.classList.toggle('done', idx<n || n===5);
    s.classList.toggle('current', idx===n);
  });
  document.querySelectorAll('.step-line').forEach((l,i)=>l.classList.toggle('done', i<n-1));
  const order=['sec-brand','sec-model','sec-storage','sec-grade','sec-result'];
  order.forEach((id,i)=>{
    const el=$(id);
    const show = n===5 ? id==='sec-result' : (i+1)===n;
    el.classList.toggle('hidden', !show);
    if(show) restartAnim(el);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.step').forEach(s=>{
  s.addEventListener('click',()=>{
    const n=parseInt(s.dataset.step,10);
    if(n>=1&&n<=4&&n<step) goStep(n);
  });
});

/* ---------- 前台渲染 ---------- */
function renderBrands(){
  const g=$('brandGrid');
  g.innerHTML='';
  DATA.brands.forEach(b=>{
    const el=document.createElement('button');
    el.className='brand-card'+(b.id===sel.brand?' active':'');
    el.innerHTML='<span class="brand-logo">'+b.logo+'</span><span class="brand-name">'+b.name+'</span><span class="brand-cnt">'+b.models.length+' 款机型</span>';
    el.addEventListener('click',()=>{
      sel.brand=b.id; sel.model=null; sel.storage=null; sel.grade=null;
      renderBrands(); renderModels(); goStep(2);
    });
    g.appendChild(el);
  });
}
function renderModels(){
  const b=curBrand(), list=$('modelList');
  if(!b) return;
  list.innerHTML='';
  b.models.forEach(m=>{
    const minP=Math.min.apply(null,m.prices);
    const el=document.createElement('button');
    el.className='model-item'+(m.name===sel.model?' active':'');
    el.innerHTML='<span class="model-name"></span><span class="model-price"></span>';
    el.querySelector('.model-name').textContent=b.name.split(' ')[0]+' '+m.name;
    el.querySelector('.model-price').textContent=fmt(minP)+' 起';
    el.addEventListener('click',()=>{
      sel.model=m.name; sel.storage=null; sel.grade=null;
      renderModels(); renderStorages(); goStep(3);
    });
    list.appendChild(el);
  });
}
function renderStorages(){
  const m=curModel(), c=$('storageChips');
  if(!m) return;
  c.innerHTML='';
  m.storages.forEach((s,i)=>{
    const el=document.createElement('button');
    el.className='chip'+(i===sel.storage?' active':'');
    el.textContent=s;
    el.addEventListener('click',()=>{
      sel.storage=i; sel.grade=null;
      renderStorages(); renderGrades(); goStep(4);
    });
    c.appendChild(el);
  });
}
function renderGrades(){
  const m=curModel(), c=$('gradeList');
  if(!m) return;
  c.innerHTML='';
  GRADES.forEach((g,i)=>{
    const price=calcPrice(m, sel.storage, g.rate);
    const el=document.createElement('button');
    el.className='grade-item'+(i===sel.grade?' active':'');
    el.innerHTML='<span class="grade-badge">'+g.id+'</span>'
      +'<span class="grade-info"><span class="grade-name">'+g.name+'</span><span class="grade-desc">'+g.desc+'</span></span>'
      +'<span class="grade-side"><span class="grade-rate">'+Math.round(g.rate*100)+'%</span><span class="grade-price">'+fmt(price)+'</span></span>';
    el.addEventListener('click',()=>{
      sel.grade=i; renderGrades(); showResult();
    });
    c.appendChild(el);
  });
}
function showResult(){
  const b=curBrand(), m=curModel(), g=GRADES[sel.grade];
  if(!b||!m||sel.storage===null||!g) return;
  const price=calcPrice(m, sel.storage, g.rate);
  const priceEl=$('resultPrice');
  priceEl.textContent=fmt(price);
  priceEl.classList.remove('price-pop');
  void priceEl.offsetWidth;
  priceEl.classList.add('price-pop');
  $('resultDesc').textContent=b.name+' · '+m.name+' · '+m.storages[sel.storage]+' · '+g.name+' ('+Math.round(g.rate*100)+'%)';
  goStep(5);
}

/* ---------- 长按齿轮进后台 ---------- */
const RING_C = 2*Math.PI*25.5;
const gearWrap=$('gearWrap'), gearBtn=$('gearBtn'), gearRing=$('gearRing');
function ringReset(){
  gearRing.style.transition='none';
  gearRing.style.strokeDasharray=RING_C.toFixed(1);
  gearRing.style.strokeDashoffset=RING_C.toFixed(1);
}
ringReset();
function startHold(e){
  e.preventDefault();
  gearWrap.classList.add('holding');
  gearRing.style.transition='none';
  gearRing.style.strokeDashoffset=RING_C.toFixed(1);
  void gearRing.getBoundingClientRect();
  gearRing.style.transition='stroke-dashoffset '+HOLD_MS+'ms linear';
  gearRing.style.strokeDashoffset='0';
  holdTimer=setTimeout(openPw, HOLD_MS);
}
function cancelHold(){
  clearTimeout(holdTimer);
  gearWrap.classList.remove('holding');
  ringReset();
}
gearBtn.addEventListener('pointerdown',startHold);
['pointerup','pointercancel','pointerleave'].forEach(ev=>gearBtn.addEventListener(ev,cancelHold));

  if(!e.target.classList.contains('price-inp')) return;
  const mi=parseInt(e.target.dataset.mi,10), si=parseInt(e.target.dataset.si,10);
  const model=DATA.brands[adminBrand]&&DATA.brands[adminBrand].models[mi];
  if(!model) return;
  const v=parseInt(e.target.value,10);
  if(isNaN(v)||v<0){ toast('请输入有效价格'); e.target.value=model.prices[si]; return; }
  model.prices[si]=v; save(); toast('价格已保存');
});
$('amodels').addEventListener('click',e=>{
  if(!e.target.classList.contains('adel')) return;
  const mi=parseInt(e.target.dataset.mi,10);

  if(!model) return;
  if(confirm('确定删除「'+model.name+'」吗？')){
    DATA.brands[adminBrand].models.splice(mi,1);
    save(); renderAdminModels(); renderAdminBrands(); renderBrands(); updateAddTip(); toast('已删除');

$('addBtn').addEventListener('click',()=>{

  if(prices.some(p=>p<0)) return toast('价格不能为负数');

  save(); renderAdminModels(); renderAdminBrands(); renderBrands();
  $('addName').value=''; $('addStorage').value=''; $('addPrice').value='';
  toast('已添加「'+name+'」');
});

/* ---------- 店铺设置 ---------- */
function fillShopForm(){
  $('setName').value=DATA.shop.name;
  $('setWechat').value=DATA.shop.wechat;
  $('setPhone').value=DATA.shop.phone;
}
$('saveShop').addEventListener('click',()=>{
  DATA.shop.name=$('setName').value.trim()||'XX手机回收';
  DATA.shop.wechat=$('setWechat').value.trim()||'待更新';
  DATA.shop.phone=$('setPhone').value.trim()||'待更新';
  save(); updateFront(); toast('店铺设置已保存');
});

/* ---------- 数据管理 ---------- */
$('btnExport').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='手机回收报价数据.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },300);
  toast('已导出');
});
$('btnImport').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(!obj||!obj.brands||!Array.isArray(obj.brands)) throw new Error('bad');
      DATA.brands=normalize(clone(obj)).brands;
      if(obj.shop&&obj.shop.name) DATA.shop=obj.shop;
      save(); refreshAll(); renderAdminBrands(); renderAdminModels(); fillShopForm(); updateAddTip();
      toast('导入成功');
    }catch(err){ toast('文件格式不正确'); }
  };
  r.readAsText(f);
  e.target.value='';
});
$('btnReset').addEventListener('click',()=>{
  if(!confirm('确定恢复为默认报价数据吗？当前所有修改将丢失。')) return;
  DATA=clone(BASE);
  save(); refreshAll(); renderAdminBrands(); renderAdminModels(); fillShopForm(); updateAddTip();
  toast('已重置为默认数据');
});

/* ---------- 刷新前台 ---------- */
function updateFront(){
  $('shopName').textContent=DATA.shop.name;
  $('footWechat').textContent=DATA.shop.wechat;
  $('footPhone').textContent=DATA.shop.phone;
}
function refreshAll(){
  updateFront(); renderBrands();
  if(step>=2) renderModels();
  if(step>=3) renderStorages();
  if(step>=4) renderGrades();
  if(step===5&&sel.grade!==null) showResult();
}

/* ---------- 初始化 ---------- */
$('today').textContent=todayStr()+' 更新';
updateFront();
renderBrands();
goStep(1);
lucide.createIcons();
</script>

</body>
</html>
